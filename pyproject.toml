[project]
name = "wordwrangler-tui"
version = "0.1.0"
description = "A k9s-style terminal UI for playing wordwrangler.us's daily word-square puzzle."
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
]

[project.scripts]
wordwrangler = "wordwrangler_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordwrangler_tui"]
